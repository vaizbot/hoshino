# Cloudflare Worker：VaizBot 定时取源抓取 + TTS 语音合成 + 翻译
name = "api"
main = "src/index.ts"
compatibility_date = "2026-11-28"

# 定时任务（Cron 表达式是 UTC 时间）
# "0 16 * * *"  = UTC 16:00 = 北京时间 次日 0:00  -> 任务 A：自动发布一篇草稿
# "30 16 * * *" = UTC 16:30 = 北京时间 次日 0:30  -> 任务 B：预抓一篇新文章
[triggers]
crons = ["0 16 * * *", "30 16 * * *"]

# Workers AI 绑定：翻译模型（/translate 路由使用，无需额外密钥，直接绑定即可）
[ai]
binding = "AI"

[vars]
# Supabase 项目 URL（与前端同一个项目地址，非机密）
# 音频存 Supabase Storage 的公开桶 audio（无需绑卡，见 README）
SUPABASE_URL = "https://ligrbkiamigtuxfcfxkf.supabase.co"
# CORS 允许的前端域名（逗号分隔）：本地开发地址 + Pages 域名
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:4173,https://your-site.pages.dev"
# 声线采样（三个视频重新提取 + 降噪清洗）的公开地址：五种声线共用此采样
MIMO_VOICE_SAMPLE_URL = "https://ligrbkiamigtuxfcfxkf.supabase.co/storage/v1/object/public/audio/samples/voice-videos-v3.wav"

# 机密变量全部用 wrangler secret put 管理（不写在本文件里）：
#   MIMO_API_KEY              小米 MiMo 语音接口密钥
#   SUPABASE_SERVICE_ROLE_KEY Supabase 写库密钥
